services:
  db:
    image: postgres:16-alpine
    container_name: ems-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    ports:
      - "5432:5432"
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD:-ems_dev_password}@db:5432/${POSTGRES_DB:-ems}?schema=public
      NODE_ENV: development
      PORT: 8080
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src:ro
      - ./prisma:/app/prisma
      - ./frontend:/app/frontend:ro
      - ./data-source:/app/data-source:ro
      - ./backend/scripts:/app/scripts:ro

  adminer:
    image: adminer:latest
    container_name: ems-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db


  # Production build (Cloud Run simulation) - only starts with --profile prod
  # Usage: docker compose --profile prod up -d
  # Access at http://localhost:9090
  # Data is EPHEMERAL SQLite (mimics Cloud Run behavior)
  ems-backend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    container_name: ems-backend-prod
    ports:
      - "9090:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/tmp/data.db
      GOOGLE_OAUTH_CLIENT_ID: 446056303892-lcuj4rf9hv047sujfklb2vacqtd93k45.apps.googleusercontent.com
      GOOGLE_WORKSPACE_DOMAIN: ""
      CORS_ORIGIN: "http://localhost:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ems_pgdata:
    driver: local
