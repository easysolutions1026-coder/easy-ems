# ════════════════════════════════════════════════════════════════════
# IMSE EASY EMS — Local development stack
# ════════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d
#   docker compose exec backend npx prisma migrate dev
#   docker compose logs -f backend
#
# In production (Cloud Run), the backend runs as a serverless container
# and Postgres is Cloud SQL — this file is dev-only.
# ════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    container_name: ems-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    ports:
      - "5432:5432"
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD:-ems_dev_password}@db:5432/${POSTGRES_DB:-ems}?schema=public
      NODE_ENV: development
      PORT: 8080
      # Google OAuth — used to verify tokens sent by the browser
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      # CORS origin — where the HTML is served from during dev
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      # Mount source for hot reload during dev; production image doesn't need this
      - ./backend/src:/app/src:ro
      - ./prisma:/app/prisma:ro
      # Frontend files served by the backend during local dev
      - ./frontend:/app/frontend:ro

  # OPTIONAL — Adminer web UI for browsing the DB during dev.
  # Comment out if you use pgAdmin, DBeaver, or the psql CLI instead.
  adminer:
    image: adminer:latest
    container_name: ems-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  ems_pgdata:
    driver: local
