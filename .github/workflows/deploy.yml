name: Deploy to Cloud Run

# Trigger on push to main OR manual trigger from GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows "Run workflow" button in GitHub Actions tab

env:
  PROJECT_ID: easy-ems-507406
  REGION: asia-south1
  SERVICE: ems-backend
  CLOUD_SQL_INSTANCE: easy-ems-507406:asia-south1:ems-postgres
  OAUTH_CLIENT_ID: 446056303892-lcuj4rf9hv047sujfklb2vacqtd93k45.apps.googleusercontent.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Authenticate to Google Cloud using service account key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 3: Install gcloud CLI
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Verify authentication worked
      - name: Verify gcloud auth
        run: |
          gcloud config set project ${{ env.PROJECT_ID }}
          gcloud config set run/region ${{ env.REGION }}
          echo "Authenticated as:"
          gcloud config get-value account

      # Step 5: Build Docker image using Cloud Build
      # This mirrors your manual scripts/deploy-to-cloud-run-with-sql.ps1
      - name: Build Docker image via Cloud Build
        run: |
          echo "Building Docker image..."
          gcloud builds submit --config cloudbuild.yaml --timeout=15m .

      # Step 6: Deploy to Cloud Run with Cloud SQL + Secret Manager
      - name: Deploy to Cloud Run
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --concurrency 80 \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --set-env-vars "NODE_ENV=production,GOOGLE_OAUTH_CLIENT_ID=${{ env.OAUTH_CLIENT_ID }},GOOGLE_WORKSPACE_DOMAIN=" \
            --update-secrets "DATABASE_URL=database-url:latest"

      # Step 7: Verify deployment
      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format="value(status.url)")
          echo "=========================================="
          echo "Deployment complete!"
          echo "URL: $URL"
          echo "=========================================="

      # Step 8: Health check
      - name: Health check
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format="value(status.url)")
          echo "Waiting 30 seconds for cold start..."
          sleep 30
          echo "Testing $URL/readyz/"
          if curl -f -s "$URL/readyz/" > /dev/null; then
            echo "OK Health check passed"
          else
            echo "WARN Health check failed - check Cloud Run logs"
            exit 1
          fi