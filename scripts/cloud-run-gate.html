  <!-- Cloud Run: isolate this instance from Google Sheets AND Google Drive
       JSON data during Phase A testing. Attachments (PDFs, staff docs) still
       load normally from Drive. Auto-re-applied by
       scripts/apply-cloud-run-gate.ps1 on every prod HTML sync. -->
  <script>
  (function() {
    window.__CLOUD_RUN__ = true;

    var APP_FOLDER = '1yiKJkemjF_3GFEDOMA2T5fpsFNO0IegE';

    var FILE_TO_COLLECTION = {
      'transactions.json': 'transactions',
      'parties.json': 'parties',
      'arInvoices.json': 'arInvoices',
      'settings.json': 'settings',
      'expenses.json': 'expenses',
      'bankAccounts.json': 'bankAccounts',
      'bankReconciliations.json': 'bankReconciliations',
      'chartOfAccounts.json': 'chartOfAccounts',
      'staff.json': 'staff',
      'projectExpenses.json': 'projectExpenses',
      'workLogs.json': 'workLogs',
      'payslips.json': 'payslips',
      'fundRequests.json': 'fundRequests',
      'fundPools.json': 'fundPools',
      'paymentRequests.json': 'paymentRequests',
      'appUsers.json': 'appUsers',
      'auditLog.json': 'auditLog',
      'pettyCashOffices.json': 'pettyCashOffices',
      'pettyCashTransactions.json': 'pettyCashTransactions',
      'pettyCashStatements.json': 'pettyCashStatements',
      'gstCashLedgerSnapshots.json': 'gstCashLedgerSnapshots',
      'companyDocuments.json': 'companyDocuments',
      'directorExpenses.json': 'directorExpenses',
      '_locks.json': '__NOOP__'
    };

    var SYNTHETIC_PREFIX = 'CLOUDSQL-';

    function getToken() {
      try {
        if (window.gapi && gapi.client && gapi.client.getToken) {
          var t = gapi.client.getToken();
          if (t && t.access_token) return t.access_token;
        }
      } catch (e) {}
      return window.accessToken || window._accessToken || window.authToken || null;
    }

    function jsonResponse(obj, status) {
      return new Response(JSON.stringify(obj), {
        status: status || 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }

    function parseDiscovery(url) {
      if (url.indexOf('www.googleapis.com/drive/v3/files?') === -1) return null;
      if (url.indexOf(APP_FOLDER) === -1) return null;
      var m = url.match(/name%3D%27([^%]+\.json)%27|name%3D'([^']+\.json)'|name=%27([^%]+\.json)%27/);
      if (!m) return null;
      var filename = decodeURIComponent(m[1] || m[2] || m[3]);
      var collection = FILE_TO_COLLECTION[filename];
      if (collection === undefined) return null;
      return { filename: filename, collection: collection };
    }

    function parseRead(url) {
      var m = url.match(/www\.googleapis\.com\/drive\/v3\/files\/([^?/]+)\?alt=media/);
      if (!m) return null;
      var id = m[1];
      if (id.indexOf(SYNTHETIC_PREFIX) !== 0) return null;
      return { collection: id.slice(SYNTHETIC_PREFIX.length) };
    }

    function parseWrite(url) {
      if (url.indexOf('upload/drive/v3/files') !== -1) return { create: true };
      var m = url.match(/upload\/drive\/v3\/files\/([^?]+)\?/);
      if (m && m[1].indexOf(SYNTHETIC_PREFIX) === 0) {
        return { update: true, collection: m[1].slice(SYNTHETIC_PREFIX.length) };
      }
      return null;
    }

    var origFetch = window.fetch;
    window.fetch = function(input, init) {
      var url = typeof input === 'string' ? input : (input && input.url) || '';

      if (url.indexOf('https://sheets.googleapis.com') === 0) {
        console.info('[Cloud Run] Sheets call blocked:', url.slice(0, 120));
        return Promise.resolve(jsonResponse({
          sheets: [], values: [], spreadsheetId: null, replies: []
        }));
      }

      var disc = parseDiscovery(url);
      if (disc) {
        if (disc.collection === '__NOOP__') {
          console.info('[Cloud Run] Drive discovery no-op:', disc.filename);
          return Promise.resolve(jsonResponse({ files: [] }));
        }
        console.info('[Cloud Run] Drive discovery ->', disc.filename, '-> Cloud SQL:', disc.collection);
        return Promise.resolve(jsonResponse({
          files: [{ id: SYNTHETIC_PREFIX + disc.collection }]
        }));
      }

      var read = parseRead(url);
      if (read) {
        console.info('[Cloud Run] Drive read -> Cloud SQL:', read.collection);
        var token = getToken();
        return origFetch('/api/data/' + read.collection, {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
      }

      var write = parseWrite(url);
      if (write && write.update && init && init.body) {
        console.info('[Cloud Run] Drive write -> Cloud SQL:', write.collection);
        var token2 = getToken();
        return extractJsonBody(init.body).then(function(payload) {
          return origFetch('/api/data/' + write.collection, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': token2 ? 'Bearer ' + token2 : ''
            },
            body: JSON.stringify(payload)
          }).then(function(r) {
            return jsonResponse({
              id: SYNTHETIC_PREFIX + write.collection,
              modifiedTime: new Date().toISOString()
            });
          });
        });
      }

      return origFetch.apply(this, arguments);
    };

    function extractJsonBody(body) {
      return Promise.resolve(body).then(function(b) {
        if (typeof b === 'string') return b;
        if (b instanceof Blob) return b.text();
        if (b && typeof b.text === 'function') return b.text();
        return String(b);
      }).then(function(text) {
        var jsonBlocks = text.match(/\{[\s\S]*?\}(?=\s*--|\s*$)/g) || [];
        for (var i = jsonBlocks.length - 1; i >= 0; i--) {
          try { return JSON.parse(jsonBlocks[i]); } catch (e) {}
        }
        try { return JSON.parse(text); } catch (e) { return []; }
      });
    }

    var installStub = function() {
      if (typeof window.syncToGoogleSheets === 'function' && !window.syncToGoogleSheets.__cloudRunStub) {
        window.syncToGoogleSheets = function() {
          console.info('[Cloud Run] Sheets sync button suppressed');
          if (typeof _showToast === 'function') {
            _showToast('Cloud Run mode - Sheets sync disabled during testing', '#0369a1', 4000);
          } else {
            alert('Cloud Run mode - Sheets sync is disabled during testing.');
          }
        };
        window.syncToGoogleSheets.__cloudRunStub = true;
        console.info('[Cloud Run] syncToGoogleSheets stub installed');
        return true;
      }
      return false;
    };
    if (!installStub()) {
      var tries = 0;
      var t = setInterval(function() {
        if (installStub() || ++tries > 50) clearInterval(t);
      }, 200);
    }

    console.info('[Cloud Run] Sheets + Drive JSON isolation active - Cloud SQL only mode');
  })();
  </script>
  <!-- CLOUD_RUN_GATE_END -->
