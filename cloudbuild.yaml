# Cloud Build configuration for IMSE EASY EMS
# Builds the production Docker image using backend/Dockerfile.production

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ems-backend:latest'
      - '-f'
      - 'backend/Dockerfile.production'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/ems-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'